name: CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.3.4")
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          PATCH=$((PATCH + 1))
          VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          BUILD=$((134 + GITHUB_RUN_NUMBER))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION (build $BUILD)"

      - name: Generate Version.swift
        run: |
          cat > Sources/VideoCompareGUI/Version.swift <<VSWIFT
          public enum AppVersion {
              public static let marketing = "${{ steps.version.outputs.version }}"
              public static let build = "${{ steps.version.outputs.build }}"
          }
          VSWIFT

      - name: Build (debug)
        run: swift build

      - name: Run unit tests
        run: swift test

      - name: Run self-test
        run: ./.build/debug/VideoCompareGUI --selftest

      - name: Build release binary
        run: swift build -c release

      - name: Assemble app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          CREATE_DMG: "1"
        run: ./make_app.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: build/Video-Compare-GUI.dmg
          generate_release_notes: true
